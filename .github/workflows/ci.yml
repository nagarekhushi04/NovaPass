name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smart-contract:
    name: Build & Test Smart Contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts/voucher_hub
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/voucher_hub

      - name: Build contract
        run: cargo build --target wasm32v1-none --release

      - name: Run tests
        run: cargo test

  frontend:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Run tests
        run: npm test --if-present

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: [smart-contract, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment Placeholder
        run: |
          echo "This is a placeholder for the deployment job."
          echo "You can add deployment steps here (e.g., Vercel, Netlify, Docker, or Stellar contract deployment)."
          echo "Deploying to production..."
